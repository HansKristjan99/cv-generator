[project]
name = "cv-generator-be"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.136.1",
    "openai>=2.33.0",
    "pydantic>=2.13.3",
    "python-multipart>=0.0.27",
    "uvicorn[standard]>=0.46.0",
]

[dependency-groups]
dev = [
    "mypy>=1.20.2",
    "pytest>=9.0.3",
    "pytest-dotenv>=0.5.2",
    "ruff>=0.15.12",
]

[tool.uv.workspace]
members = [
    "infra",
]

[tool.pytest.ini_options]
pythonpath = ["."]
