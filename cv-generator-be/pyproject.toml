[project]
name = "cv-generator-be"
version = "0.1.0"
description = "FastAPI backend for AI-assisted CV generation."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.18.4",
    "clerk-backend-api>=5.0.6",
    "fastapi>=0.136.1",
    "openai>=2.33.0",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.3",
    "pydantic-settings>=2.14.1",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.27",
    "sqlalchemy>=2.0.49",
    "stripe>=15.1.0",
    "uvicorn[standard]>=0.46.0",
]

[dependency-groups]
dev = [
    "mypy>=1.20.2",
    "pytest>=9.0.3",
    "pytest-dotenv>=0.5.2",
    "ruff>=0.15.12",
]

[tool.uv.workspace]
members = [
    "infra",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["app/tests"]
python_files = ["test_*.py"]
