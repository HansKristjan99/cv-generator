name = "cv-generator"
main = "worker.js"
compatibility_date = "2026-05-19"

# Serve the Vite build output as static assets.
# API calls go directly to VITE_API_BASE_URL. The worker adds security headers
# and SPA fallback for client-side routes; it does not proxy API traffic.
[assets]
directory = "./dist"
binding = "ASSETS"
